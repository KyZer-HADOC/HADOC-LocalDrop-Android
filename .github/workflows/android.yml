name: Android APK
on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HADOC-LocalDrop-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Prepare release assets
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk HADOC-LocalDrop-Android.apk
          sha256sum HADOC-LocalDrop-Android.apk > SHA256SUMS.txt
      - name: Publish v1.0.0 GitHub Release
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: HADOC LocalDrop Android v1.0.0
          body: |
            ## HADOC LocalDrop Android

            First public Android build for **phone-to-phone sharing**.

            - QR pairing with **Show QR** and **Scan QR**
            - Temporary Android Local-Only Hotspot (not the normal portable hotspot)
            - Wi-Fi only; Bluetooth is not required
            - One-time QR token; first successful device consumes the code
            - Direct local chat and file transfer with progress and speed display

            **Connection note:** Android displays its own Wi-Fi join approval after scanning. Approve that system prompt to connect. Local-Only Hotspot has no internet access and is released when the sharing session ends.

            This is a debug-signed APK intended for initial device testing. Source code is available in the repository and GitHub's automatic source archives.
          files: |
            HADOC-LocalDrop-Android.apk
            SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
      - name: Attach APK to version tag release
        if: startsWith(github.ref, 'refs/tags/') && github.ref_name != 'v1.0.0'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            HADOC-LocalDrop-Android.apk
            SHA256SUMS.txt
          generate_release_notes: true
