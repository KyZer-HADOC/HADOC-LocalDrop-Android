name: Android APK
on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HADOC-LocalDrop-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Prepare release assets
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk HADOC-LocalDrop-Android.apk
          sha256sum HADOC-LocalDrop-Android.apk > SHA256SUMS.txt
      - name: Publish v1.0.5 GitHub Release
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5
          name: HADOC LocalDrop Android v1.0.5
          body: |
            ## HADOC LocalDrop Android

            Android app supporting **phone-to-phone and Windows PC sharing**.

            - QR pairing with **Show QR** and **Scan QR**
            - Temporary Android Local-Only Hotspot (not the normal portable hotspot)
            - PC QR pairing can request a temporary connection to the router using Wi-Fi details embedded in the PC QR
            - All PC HTTP and WebSocket traffic is routed over the selected temporary Wi-Fi network
            - The Windows app stores the router Wi-Fi password encrypted with Windows DPAPI
            - Wi-Fi only; Bluetooth is not required
            - One-time QR token; first successful device consumes the code
            - Direct local chat and file transfer with progress and speed display
            - Native **Connect PC** mode: scan the Windows app QR and use chat/file sharing inside the Android app
            - Phone-to-PC uploads and PC-to-phone downloads over the local network

            **Connection note:** Android displays its own Wi-Fi join approval after scanning. Approve that system prompt to connect. For PC pairing, the QR contains the router Wi-Fi passphrase and must be kept private. The app releases its temporary router connection when the PC session ends. Phone-to-phone Local-Only Hotspot has no internet access and is released when that sharing session ends.

            This is a debug-signed APK intended for initial device testing. Source code is available in the repository and GitHub's automatic source archives.
          files: |
            HADOC-LocalDrop-Android.apk
            SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
      - name: Attach APK to version tag release
        if: startsWith(github.ref, 'refs/tags/') && github.ref_name != 'v1.0.5'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            HADOC-LocalDrop-Android.apk
            SHA256SUMS.txt
          generate_release_notes: true
